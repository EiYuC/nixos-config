; Layout adapted from Polybar 3.7.2's official example.
; Catppuccin Mocha palette: https://github.com/catppuccin/polybar
; See SOURCES.md for upstream links and the palette license.
[colors]
base = #1e1e2e
mantle = #181825
surface = #313244
text = #cdd6f4
muted = #6c7086
mauve = #cba6f7
blue = #89b4fa
green = #a6e3a1
yellow = #f9e2af
red = #f38ba8
peach = #fab387
teal = #94e2d5

[bar/main]
width = 100%
height = 40
radius = 10
background = ${colors.base}
foreground = ${colors.text}
font-0 = Noto Sans:size=11;3
font-1 = Symbols Nerd Font Mono:size=13;3
font-2 = Noto Sans CJK SC:size=11;3
padding-left = 2
padding-right = 2
module-margin = 1
line-size = 3
border-size = 2
border-color = ${colors.base}
modules-left = launcher i3
modules-center = date
modules-right = wired wifi cpu memory battery audio tray power
separator = " "
enable-ipc = true
cursor-click = pointer
cursor-scroll = ns-resize

[module/launcher]
type = custom/text
format = ""
format-foreground = ${colors.blue}
format-padding = 1
click-left = rofi -show drun
click-right = sh ~/.config/i3/scripts/keyhint

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
index-sort = true
enable-click = true
enable-scroll = false
format = <label-state> <label-mode>
label-focused = %index%
label-focused-background = ${colors.surface}
label-focused-foreground = ${colors.mauve}
label-focused-underline = ${colors.mauve}
label-focused-padding = 2
label-unfocused = %index%
label-unfocused-foreground = ${colors.muted}
label-unfocused-padding = 2
label-visible = %index%
label-visible-foreground = ${colors.text}
label-visible-padding = 2
label-urgent = %index%
label-urgent-background = ${colors.red}
label-urgent-foreground = ${colors.base}
label-urgent-padding = 2
label-mode = %mode%
label-mode-foreground = ${colors.peach}
label-mode-padding = 1

[module/date]
type = internal/date
interval = 1
date = %a, %d %b  ·  %H:%M
date-alt = %Y-%m-%d  ·  %H:%M:%S
format-prefix = "󰃭  "
format-prefix-foreground = ${colors.mauve}
label = %date%

[network-base]
type = internal/network
interval = 3
format-connected = <label-connected>
label-connected-maxlen = 16
label-connected-ellipsis = true
format-disconnected = <label-disconnected>
label-disconnected = ""

[module/wired]
inherit = network-base
interface-type = wired
format-connected-prefix = "󰈀  "
format-connected-prefix-foreground = ${colors.teal}
label-connected = LAN

[module/wifi]
inherit = network-base
interface-type = wireless
format-connected-prefix = "󰖩  "
format-connected-prefix-foreground = ${colors.teal}
label-connected = %essid%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "  "
format-prefix-foreground = ${colors.blue}
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 3
format-prefix = "  "
format-prefix-foreground = ${colors.mauve}
label = %gb_used%

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 99
low-at = 20
poll-interval = 5
format-charging = <animation-charging> <label-charging>
format-charging-foreground = ${colors.green}
label-charging = %percentage%%
format-discharging = <ramp-capacity> <label-discharging>
label-discharging = %percentage%%
ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁼
ramp-capacity-2 = 󰁾
ramp-capacity-3 = 󰂀
ramp-capacity-4 = 󰁹
ramp-capacity-foreground = ${colors.green}
animation-charging-0 = 󰢜
animation-charging-1 = 󰂆
animation-charging-2 = 󰂈
animation-charging-3 = 󰂊
animation-charging-4 = 󰂅
animation-charging-framerate = 750
format-full = <label-full>
label-full = "󰂅 %percentage%%"
label-full-foreground = ${colors.green}
format-low = <label-low>
label-low = "󰂃 %percentage%%"
label-low-foreground = ${colors.red}

[module/audio]
type = internal/pulseaudio
use-ui-max = false
interval = 5
format-volume = <ramp-volume> <label-volume>
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-foreground = ${colors.peach}
label-volume = %percentage%%
label-muted = "󰖁 muted"
label-muted-foreground = ${colors.muted}
click-right = pavucontrol

[module/tray]
type = internal/tray
tray-size = 18
tray-spacing = 10
format-padding = 1

[module/power]
type = custom/text
format = "󰐥"
format-foreground = ${colors.red}
format-padding = 1
click-left = sh ~/.config/i3/scripts/powermenu

[settings]
screenchange-reload = true
pseudo-transparency = false
