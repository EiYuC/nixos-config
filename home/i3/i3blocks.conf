separator=true
separator_block_width=12
markup=pango
[volume]
command=sh ~/.config/i3/scripts/volume
interval=5
color=#cbd5e1
[cpu]
command=printf 'CPU %s' "$(cut -d ' ' -f 1 /proc/loadavg)"
interval=10
color=#cbd5e1
[memory]
command=free -h | awk '/^Mem:/ {printf "RAM %s/%s", $3, $2}'
interval=10
color=#cbd5e1
[battery]
command=sh ~/.config/i3/scripts/battery
interval=30
color=#cbd5e1
[time]
command=date '+%Y-%m-%d %a %H:%M'
interval=5
color=#e2e8f0
